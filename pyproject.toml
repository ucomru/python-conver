[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conver"
dynamic = ["version"]
dependencies = ["click"]
requires-python = ">=3.12"
authors = [{ name="Timur Ulyahin", email="ucomru@pm.me" }]
description = "A cross-platform Word document converter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["conversion", "documents", "office", "tools", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/ucomru/python-conver"
Repository = "https://github.com/ucomru/python-conver"
Documentation = "https://github.com/ucomru/python-conver"
Issues = "https://github.com/ucomru/python-conver/issues"

[project.scripts]
conver = "conver.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conver = [
    "py.typed",
    "scripts/convert.jxa",
    "scripts/convert.ps1",
]

[tool.setuptools.dynamic]
version = { attr = "conver.__version__" }

[tool.ruff]
line-length = 88
